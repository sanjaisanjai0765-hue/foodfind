<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOODFIND admin</title><link rel="stylesheet" href="css/style.css"></head><body>
<section class="section narrow"><h2>Shop verification</h2>
<div class="toolbar"><input id="tok" type="password" placeholder="Admin token"><button class="btn" id="load">Load pending shops</button></div>
<p id="msg" class="status" role="status"></p><div id="list"></div></section>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=()=>({"Content-Type":"application/json","x-admin-token":$("#tok").value});
async function load(){
  $("#msg").className="status";$("#msg").textContent="Loading...";
  const r=await fetch("/api/admin/shops?status=pending",{headers:H()});
  if(!r.ok){$("#msg").className="status err";$("#msg").textContent=r.status==401?"Wrong admin token (set ADMIN_TOKEN in .env and restart the server).":"Server error";$("#list").innerHTML="";return;}
  const shops=await r.json();$("#msg").textContent=shops.length+" shop(s) waiting";
  $("#list").innerHTML=shops.map(s=>`<article class="card" style="margin-bottom:16px"><div class="card-b">
   <h3>${esc(s.name)} <span class="muted">· ${esc(s.cuisine)}</span></h3>
   <p>${esc(s.address)}</p><p class="muted">Owner email: ${esc(s.email)} · Phone: ${esc(s.phone)||"-"} · Hours: ${esc(s.hours)||"-"}</p>
   <p><a class="spec" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${+s.lat}&mlon=${+s.lng}#map=18/${+s.lat}/${+s.lng}">Check location on map</a></p>
   <p class="muted">${s.menu.map(d=>esc(d.name)+" ₹"+d.price+(d.name===s.special?" ★":"")).join(" · ")}</p>
   <div class="toolbar"><button class="btn" data-id="${esc(s.id)}" data-a="approve">Approve</button><button class="btn ghost" data-id="${esc(s.id)}" data-a="reject">Reject</button></div></div></article>`).join("");
}
$("#load").onclick=load;
$("#list").onclick=async e=>{const b=e.target.closest("[data-id]");if(!b)return;
  const r=await fetch("/api/admin/decide",{method:"POST",headers:H(),body:JSON.stringify({id:b.dataset.id,action:b.dataset.a})});
  if(r.ok)load();else{$("#msg").className="status err";$("#msg").textContent="Could not save decision";}};
</script></body></html>
